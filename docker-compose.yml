services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - library-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LIBRARY_JWT_SECRET: ${LIBRARY_JWT_SECRET:-}
      LIBRARY_JWT_LIFETIME: ${LIBRARY_JWT_LIFETIME:-PT2H}
      LIBRARY_TIME_ZONE: ${LIBRARY_TIME_ZONE:-Asia/Kolkata}
      LIBRARY_CORS_ORIGINS: ${LIBRARY_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LIBRARY_SEED_ENABLED: ${LIBRARY_SEED_ENABLED}
      LIBRARY_ADMIN_PASSWORD: ${LIBRARY_ADMIN_PASSWORD}
      LIBRARY_LIBRARIAN_PASSWORD: ${LIBRARY_LIBRARIAN_PASSWORD}
      LIBRARY_STUDENT_PASSWORD: ${LIBRARY_STUDENT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  library-db:
