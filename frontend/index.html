<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Library Desk</title>
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="/vendor/lucide.min.js"></script>
    <script type="module" src="/js/login.js"></script>
</head>
<body>
    <div class="login">
        <main class="login-main">
            <div class="brand"><span class="brand-mark"><i data-lucide="library-big"></i></span>Library Desk</div>
            <section class="login-form" aria-labelledby="login-title">
                <h1 id="login-title">Sign in to Library Desk</h1>
                <form id="login-form" class="stack">
                    <label>Username<input name="username" required maxlength="80" autocomplete="username"></label>
                    <label>Password<input name="password" required maxlength="72" type="password" autocomplete="current-password"></label>
                    <p class="error-text" id="login-error" role="alert"></p>
                    <button class="btn" type="submit">Sign in</button>
                </form>
            </section>
        </main>
        <div class="login-art" aria-hidden="true"></div>
    </div>
</body>
</html>
