<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction history · Library Desk</title>
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="/vendor/lucide.min.js"></script>
    <script type="module" src="/js/history.js"></script>
</head>
<body data-page="history">
    <div class="app" id="app" hidden>
        <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
        <button class="overlay" id="nav-overlay" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
        <div class="main-area">
            <header class="topbar" id="topbar"></header>
            <main class="stack" id="main">
                <header class="page-heading">
                    <div><h1>Transaction history</h1><p>Review issued and returned books by student or book.</p></div>
                    <div id="page-actions" class="button-group" hidden></div>
                </header>
        <section class="panel" aria-label="Transaction history">
            <form id="history-filters" class="filters">
                <label>Student<select name="studentId"><option value="">All students</option></select></label>
                <label>Book<select name="bookId"><option value="">All books</option></select></label>
                <button class="btn btn-secondary" type="submit"><i data-lucide="list-filter"></i> Apply</button>
            </form>
            <p class="error-text" id="history-error" role="alert"></p>
            <div id="history-table"></div>
        </section>

            </main>
        </div>
    </div>
</body>
</html>
