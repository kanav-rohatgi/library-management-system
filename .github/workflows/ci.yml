name: Library CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

      - name: Build both Docker images
        run: docker compose build backend frontend

      - name: Start and check the Compose stack
        run: |
          docker compose up --detach --no-build --wait --wait-timeout 240
          curl --fail --silent --show-error http://localhost:8080/actuator/health
          curl --fail --silent --show-error --location http://localhost:8080/swagger-ui.html --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://localhost:8081/ --output /dev/null
          curl --fail --silent --show-error http://localhost:3000/ | grep -F 'Sign in to Library Desk'
          token="$(curl --fail --silent --show-error http://localhost:3000/api/auth/login \
            --header 'Content-Type: application/json' \
            --data '{"username":"student","password":"DemoStudent123!"}' \
            | python3 -c 'import json, sys; result = json.load(sys.stdin); assert result["role"] == "STUDENT"; print(result["token"])')"
          curl --fail --silent --show-error http://localhost:3000/api/books \
            --header "Authorization: Bearer ${token}" \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["totalElements"] >= 3'

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
