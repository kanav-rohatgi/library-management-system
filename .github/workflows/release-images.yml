name: Release container images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a release tag such as v1.0.0." >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.repository }}-backend:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=min
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.repository }}-frontend:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=min
          cache-from: type=gha,scope=frontend-release
          cache-to: type=gha,mode=max,scope=frontend-release

      - name: Record deployable image references
        env:
          IMAGE_REPOSITORY: ${{ steps.release.outputs.repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo 'Release image references'
            echo
            echo '~~~dotenv'
            echo "LIBRARY_BACKEND_IMAGE=${IMAGE_REPOSITORY}-backend@${BACKEND_DIGEST}"
            echo "LIBRARY_FRONTEND_IMAGE=${IMAGE_REPOSITORY}-frontend@${FRONTEND_DIGEST}"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
